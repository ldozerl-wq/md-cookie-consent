<!--
  ============================================================================
  MD-CC · Inline-вариант для GTM Custom HTML
  ----------------------------------------------------------------------------
  ФАЙЛ СГЕНЕРИРОВАН. Не редактируйте — правьте md-cookie-consent.js
  и пересоберите:  powershell -File build.ps1
  ----------------------------------------------------------------------------
  Нужен только если вы НЕ хостите md-cookie-consent.js и не используете
  шаблон тега md-cookie-consent.tpl. Рекомендуемый путь — шаблон:
  там ссылки на политики задаются полями в интерфейсе GTM при добавлении тега.

  GTM: Custom HTML tag
  Trigger:  Initialization – All Pages
  Tag firing priority: 900
  Требует Тег 1 (gtm-tag-1-consent-default.html) на Consent Initialization.

  Настройки сайта задаются переменной GTM или на самом сайте:
      window.MDCC_CONFIG = { privacyUrl: '...' };
  ============================================================================
-->
<script>
(function () {
  'use strict';

  if (window.__MDCC_LOADED__) return;
  window.__MDCC_LOADED__ = true;

  /* ==========================================================================
     1. КОНФИГУРАЦИЯ САЙТА
     --------------------------------------------------------------------------
     Значения ниже — дефолты. Всё, что задано в window.MDCC_CONFIG, их перекрывает.
     MDCC_CONFIG выставляет шаблон тега GTM (поля в интерфейсе при добавлении тега)
     либо сам сайт, если баннер подключается без GTM.
     ========================================================================== */

  /* Реквизиты оператора (название, адрес, e-mail) и права субъекта данных
     баннер не показывает — они раскрываются на странице Политики Cookie,
     ссылка на которую есть и на первом слое, и в окне настроек. */
  var DEFAULTS = {
    privacyUrl   : '/politica-de-confidentialitate',          // Политика конфиденциальности
    policyVersion: '1.0',                                     // версия политики
    revision     : 1,                                         // ++ при смене политики -> пересогласие
    defaultLang  : 'ro',                                      // ro | ru | en
    autoDetect   : 'document',                                // 'document' (<html lang>) | 'path' (/ro/, /ru/) | 'browser' | false
    layout       : 'box wide',                                // box | box wide | box inline | cloud | bar | bar inline
    position     : 'bottom left',                             // 'bottom left' | 'bottom center' | 'middle center' ...
    accent       : '#2b6cb0',                                 // цвет кнопки "Принять все"

    /* Визуальный вес кнопок первого слоя:
         'stacked'      — столбиком во всю ширину: [Принять все] [Отклонить все] [Настроить].
                          Согласие и отказ одного веса и размера, третьей идёт серая «Настроить».
                          Требование «отказаться не сложнее, чем согласиться» выполняется буквально:
                          отказ — такая же кнопка прямо под согласием. Приглушена настройка,
                          а не отказ, — это EDPB не запрещает. Значение по умолчанию с v11.
         'accept-first' — «Принять все» акцентная и прижата вправо, «Отказаться» серая.
                          Выше конверсия в согласие, НО непропорциональное выделение
                          трактуется EDPB Guidelines 03/2022 как deceptive design:
                          при проверке CNPDCP согласие может быть признано недействительным.
         'equal'        — все кнопки одного веса в родном горизонтальном ряду. */
    buttonBias   : 'stacked',
    /* Компактный первый слой на телефонах (до 640px): короткая фраза + «Подробнее», полный текст — по нажатию.
       Длинный абзац баннера на мобильном — самый крупный текстовый блок экрана, и PageSpeed засчитывал его
       как LCP (появляется поздно — после GTM). Суть (необходимые — всегда, остальные — только с согласия,
       отзыв — в полном тексте и плавающей кнопке) остаётся на первом слое; полный текст, настройки и политика — в одно нажатие. */
    compactMobile: true,
    floatingBtn  : true,                                      // плавающая кнопка "Настройки cookie"
    floatingSide : 'left',                                    // left | right
    blockPage    : false,                                     // true = затемнение + блок скролла до выбора
    cookieDays   : 182,                                       // срок хранения согласия (<= 12 мес.)
    logEndpoint  : '',                                        // URL для серверного журнала согласий (POST, необязательно)
    cdnBase      : 'https://cdn.jsdelivr.net/npm/vanilla-cookieconsent@3.1.0/dist/'
  };

  var C = {}, src = [DEFAULTS, (window.MDCC_CONFIG || {})];
  for (var s = 0; s < src.length; s++)
    for (var k in src[s])
      if (src[s].hasOwnProperty(k) && src[s][k] !== null && src[s][k] !== undefined && src[s][k] !== '')
        C[k] = src[s][k];

  function warn(msg) {
    if (window.console && window.console.warn) window.console.warn('[MD Cookie Consent] ' + msg);
  }

  /* Пустое поле в теге GTM неотличимо от незаполненного, и молчаливый откат
     на дефолтный путь даёт ссылку в 404 при внешне исправном баннере.
     Поэтому отличаем «не задано» от «задано» и говорим об этом вслух. */
  if (!(window.MDCC_CONFIG || {}).privacyUrl) {
    warn('privacyUrl не задан — ссылка ведёт на ' + C.privacyUrl + '. ' +
         'Проверьте, что страница существует на каждом языке: иначе требование ' +
         'о ссылке на политику фактически не выполнено.');
  }

  /* Поля шаблона GTM приходят строками — приводим к нужным типам */
  C.revision   = parseInt(C.revision, 10)   || 0;
  C.cookieDays = parseInt(C.cookieDays, 10) || 182;
  C.floatingBtn = (C.floatingBtn === true || C.floatingBtn === 'true');
  C.compactMobile = !(C.compactMobile === false || C.compactMobile === 'false');
  C.blockPage   = (C.blockPage  === true || C.blockPage  === 'true');
  if (C.autoDetect === 'false' || C.autoDetect === false) C.autoDetect = false;

  /* ==========================================================================
     2. CONSENT MODE v2 — карта сигналов
     ========================================================================== */

  /* Список поддерживаемых языков нужен уже при сборке CC_CONFIG (определение
     языка по адресу), поэтому объявлен здесь, а не рядом с подписями кнопки. */
  var LANGS = ['ro', 'ru', 'en'];

  var MAP = {
    necessary : ['security_storage'],
    functional: ['functionality_storage', 'personalization_storage'],
    analytics : ['analytics_storage'],
    marketing : ['ad_storage', 'ad_user_data', 'ad_personalization']
  };

  window.dataLayer = window.dataLayer || [];
  function gtag() { window.dataLayer.push(arguments); }
  window.gtag = window.gtag || gtag;

  function pushConsent(action) {
    var cc = window.CookieConsent;
    var acc = cc.getUserPreferences().acceptedCategories || [];
    var ck  = cc.getCookie() || {};

    var update = { security_storage: 'granted' };
    for (var cat in MAP) {
      if (!MAP.hasOwnProperty(cat)) continue;
      var granted = (cat === 'necessary') || acc.indexOf(cat) > -1;
      for (var i = 0; i < MAP[cat].length; i++) update[MAP[cat][i]] = granted ? 'granted' : 'denied';
    }
    gtag('consent', 'update', update);

    var rec = {
      consent_id           : ck.consentId || null,
      consent_timestamp    : ck.lastConsentTimestamp || ck.consentTimestamp || new Date().toISOString(),
      consent_language     : ck.languageCode || cc.getConfig('language').default,
      consent_revision     : ck.revision || 0,
      consent_policy_version: C.policyVersion,
      consent_action       : action,                      // accept_all | reject_all | save_custom | change
      consent_necessary    : true,
      consent_functional   : acc.indexOf('functional') > -1,
      consent_analytics    : acc.indexOf('analytics')  > -1,
      consent_marketing    : acc.indexOf('marketing')  > -1
    };

    window.dataLayer.push(mergeEvt('cookie_consent_update', rec));

    // отдельные события — удобно вешать триггеры GTM без Consent Checks
    if (rec.consent_analytics)  window.dataLayer.push({ event: 'cc_analytics_granted' });
    if (rec.consent_marketing)  window.dataLayer.push({ event: 'cc_marketing_granted' });
    if (rec.consent_functional) window.dataLayer.push({ event: 'cc_functional_granted' });

    window.__MDCC_SYNCED__ = true;   // не дублировать событие из onConsent
    logRecord(rec);
  }

  function mergeEvt(name, obj) {
    var o = { event: name, consent_source: 'banner' };
    for (var k in obj) if (obj.hasOwnProperty(k)) o[k] = obj[k];
    return o;
  }

  /* ==========================================================================
     3. ЖУРНАЛ СОГЛАСИЙ (ст. требование: запись каждого действия, не перезапись)
     ========================================================================== */

  function logRecord(rec) {
    // 3.1 — локальный append-only журнал (доказательство на стороне клиента)
    try {
      var KEY = 'mdcc_consent_log';
      var log = JSON.parse(window.localStorage.getItem(KEY) || '[]');
      log.push({
        id  : rec.consent_id,
        ts  : rec.consent_timestamp,
        lang: rec.consent_language,
        rev : rec.consent_revision,
        pv  : rec.consent_policy_version,
        act : rec.consent_action,
        cats: ['necessary']
                .concat(rec.consent_functional ? ['functional'] : [])
                .concat(rec.consent_analytics  ? ['analytics']  : [])
                .concat(rec.consent_marketing  ? ['marketing']  : []),
        url : location.pathname
      });
      if (log.length > 50) log = log.slice(-50);
      window.localStorage.setItem(KEY, JSON.stringify(log));
    } catch (e) {}

    // 3.2 — серверный журнал (если задан logEndpoint)
    if (!C.logEndpoint) return;
    try {
      var body = JSON.stringify({
        consent_id : rec.consent_id,
        timestamp  : rec.consent_timestamp,
        language   : rec.consent_language,
        revision   : rec.consent_revision,
        policy_version: rec.consent_policy_version,
        action     : rec.consent_action,
        categories : { necessary: true, functional: rec.consent_functional,
                       analytics: rec.consent_analytics, marketing: rec.consent_marketing },
        page       : location.href,
        user_agent : navigator.userAgent
      });
      if (navigator.sendBeacon) navigator.sendBeacon(C.logEndpoint, new Blob([body], { type: 'application/json' }));
      else fetch(C.logEndpoint, { method: 'POST', body: body, headers: { 'Content-Type': 'application/json' }, keepalive: true });
    } catch (e) {}
  }

  /* ==========================================================================
     4. ПЕРЕВОДЫ (RO / RU / EN)
     ========================================================================== */

  /* Одна ссылка — на политику конфиденциальности. Состав cookie, назначение,
     поставщик и срок хранения раскрываются прямо в окне настроек, поэтому
     отдельная ссылка на политику cookie из баннера убрана.
     Сама страница политики cookie по закону остаётся обязательной —
     ссылку на неё давайте из политики конфиденциальности. */
  function links(t) {
    return C.privacyUrl
      ? '<a href="' + C.privacyUrl + '">' + t.privacyPolicy + '</a>'
      : '';
  }

  /* Поставщики cookie и адреса их политик защиты данных.
     Требование: по каждому cookie видно, кто его ставит и где читать его политику.
     Названия — узнаваемые торговые, а не юридические лица: договаривающаяся
     сторона зависит от конкретного договора клиента, выдумывать её нельзя.
     Если у клиента DPA с европейским юрлицом — поправьте и название, и страну. */
  var PROVIDERS = {
    ga:       { name: 'Google Analytics',     url: 'https://policies.google.com/privacy' },
    gads:     { name: 'Google Ads',           url: 'https://policies.google.com/privacy' },
    dclk:     { name: 'Google (DoubleClick)', url: 'https://policies.google.com/privacy' },
    yt:       { name: 'YouTube (Google)',     url: 'https://policies.google.com/privacy' },
    clarity:  { name: 'Microsoft Clarity',    url: 'https://privacy.microsoft.com/privacystatement' },
    meta:     { name: 'Meta (Facebook)',      url: 'https://www.facebook.com/privacy/policy' },
    tiktok:   { name: 'TikTok',               url: 'https://www.tiktok.com/legal/privacy-policy' }
  };

  function prov(key) {
    var p = PROVIDERS[key];
    return '<a href="' + p.url + '" target="_blank" rel="noopener noreferrer">' + p.name + '</a>';
  }

  /* Cookie самого сайта: поставщик — оператор, его политика уже задана полем тега. */
  function provSelf() {
    return C.privacyUrl
      ? '<a href="' + C.privacyUrl + '">' + location.hostname + '</a>'
      : location.hostname;
  }

  function tables(t) {
    var head = { name: t.h_name, desc: t.h_desc, prov: t.h_prov, exp: t.h_exp, tr: t.h_tr };
    return {
      analytics: {
        headers: head,
        body: [
          { name: '_ga, _ga_*',   desc: t.d_ga,      prov: prov('ga'),      exp: t.e_2y,  tr: t.tr_us },
          { name: '_gid',         desc: t.d_gid,     prov: prov('ga'),      exp: t.e_24h, tr: t.tr_us },
          { name: '_clck, _clsk', desc: t.d_clarity, prov: prov('clarity'), exp: t.e_1y,  tr: t.tr_us }
        ]
      },
      marketing: {
        headers: head,
        body: [
          { name: '_fbp, _fbc',       desc: t.d_fbp, prov: prov('meta'),   exp: t.e_3m, tr: t.tr_us },
          { name: '_gcl_*',           desc: t.d_gcl, prov: prov('gads'),   exp: t.e_3m, tr: t.tr_us },
          { name: 'IDE, test_cookie', desc: t.d_ide, prov: prov('dclk'),   exp: t.e_1y, tr: t.tr_us },
          { name: '_ttp',             desc: t.d_ttp, prov: prov('tiktok'), exp: t.e_1y, tr: t.tr_tiktok }
        ]
      },
      functional: {
        headers: head,
        body: [
          { name: 'YSC, VISITOR_INFO1_LIVE', desc: t.d_yt,   prov: prov('yt'), exp: t.e_6m, tr: t.tr_us },
          { name: 'lang, locale',            desc: t.d_lang, prov: provSelf(), exp: t.e_1y, tr: t.tr_none }
        ]
      },
      necessary: {
        headers: head,
        body: [
          { name: 'cc_cookie',          desc: t.d_cc,   prov: provSelf(), exp: C.cookieDays + ' ' + t.days, tr: t.tr_none },
          { name: 'PHPSESSID / session', desc: t.d_sess, prov: provSelf(), exp: t.e_session,                 tr: t.tr_none }
        ]
      }
    };
  }

  /* Текст первого слоя: полный (десктоп) + короткий с кнопкой «Подробнее» (телефон, compactMobile).
     Какой из них виден, решает CSS (раздел 7); кнопка раскрывает полный текст (watchMoreBtn). */
  function firstLayer(full, short, more) {
    if (!C.compactMobile) return full;
    return '<span class="mdcc-full">' + full + '</span>' +
           '<span class="mdcc-short">' + short +
           ' <button type="button" class="mdcc-more" aria-expanded="false">' + more + '</button></span>';
  }

  var T = {};

  T.ro = (function () {
    var t = {
      privacyPolicy:'Politica de confidențialitate',
      days:'zile',
      h_name:'Cookie', h_desc:'Scop', h_prov:'Furnizor', h_exp:'Stocare', h_tr:'Transfer',
      tr_us:'SUA', tr_tiktok:'SUA, Singapore', tr_none:'Fără transfer',
      e_2y:'2 ani', e_1y:'1 an', e_6m:'6 luni', e_3m:'3 luni', e_24h:'24 ore', e_session:'Sesiune',
      d_ga:'Identifică vizitatorul pentru statistici agregate de trafic.',
      d_gid:'Distinge vizitatorii în cadrul unei zile.',
      d_clarity:'Hărți de căldură și înregistrări de sesiune anonimizate.',
      d_fbp:'Măsoară eficiența reclamelor și permite remarketing.',
      d_gcl:'Atribuie conversiile campaniilor Google Ads.',
      d_ide:'Afișează reclame relevante pe alte site-uri.',
      d_ttp:'Măsurarea conversiilor TikTok Ads.',
      d_yt:'Redarea videoclipurilor YouTube încorporate.',
      d_lang:'Reține limba și preferințele de afișare.',
      d_cc:'Stochează alegerea dumneavoastră privind cookie-urile.',
      d_sess:'Menține sesiunea, coșul și autentificarea.'
    };
    return {
      consentModal: {
        /* RO: короткий первый слой на всех экранах — с v7 (firstLayer не нужен).
           Ссылка на политику в текст не вшита: её отдаёт подвал (footer ниже),
           иначе в раскладке box она выводится дважды — в тексте и в подвале. */
        title: 'Folosim cookie-uri',
        description: 'Pentru analiza traficului și oferte relevante, doar cu acordul tău. Poți schimba oricând alegerea.',
        /* «Refuz toate», а не короткое «Refuz»: кнопка обязана называться
           одинаково на первом слое и в настройках. Короткий вариант остался
           с v7, когда экономили ширину горизонтального ряда на телефоне;
           со столбиком во всю ширину (buttonBias: stacked) места хватает. */
        acceptAllBtn: 'Accept toate nenecesare',
        acceptNecessaryBtn: 'Accept doar necesare',
        showPreferencesBtn: 'Setări',
        footer: links(t)
      },
      preferencesModal: {
        title: 'Preferințe privind cookie-urile',
        acceptAllBtn: 'Accept toate nenecesare',
        acceptNecessaryBtn: 'Accept doar necesare',
        savePreferencesBtn: 'Salvez preferințele',
        closeIconLabel: 'Închide',
        serviceCounterLabel: 'Serviciu|Servicii',
        sections: [
          { title: 'Cum folosim cookie-urile',
            description: 'Cookie-urile sunt fișiere mici stocate pe dispozitivul dumneavoastră. Mai jos puteți activa sau dezactiva fiecare categorie separat. Refuzul este la fel de simplu ca acceptarea și nu afectează funcțiile de bază ale site-ului.<p>' + links(t) + '</p>' },
          { title: 'Strict necesare <span class="pm__badge">Mereu active</span>',
            description: 'Asigură funcționarea site-ului: securitate, sesiune, coș de cumpărături, memorarea alegerii dumneavoastră privind cookie-urile. Temei legal: interesul legitim / executarea contractului. Nu pot fi dezactivate.',
            linkedCategory: 'necessary', cookieTable: tables(t).necessary },
          { title: 'Funcționale',
            description: 'Rețin preferințe (limbă, regiune, valută) și permit conținut încorporat: hărți, video, chat. Temei legal: consimțământul dumneavoastră.',
            linkedCategory: 'functional', cookieTable: tables(t).functional },
          { title: 'Analiză și statistică',
            description: 'Ne ajută să înțelegem cum este folosit site-ul (pagini vizitate, erori, sursa traficului), în formă agregată. Temei legal: consimțământul dumneavoastră.',
            linkedCategory: 'analytics', cookieTable: tables(t).analytics },
          { title: 'Marketing și publicitate',
            description: 'Permit măsurarea campaniilor și afișarea de reclame relevante pe acest site și pe platforme terțe. Pot implica transfer de date către furnizori din afara Republicii Moldova, pe bază de clauze contractuale standard.',
            linkedCategory: 'marketing', cookieTable: tables(t).marketing }
        ]
      }
    };
  })();

  T.ru = (function () {
    var t = {
      privacyPolicy:'Политика конфиденциальности',
      days:'дн.',
      h_name:'Cookie', h_desc:'Назначение', h_prov:'Поставщик', h_exp:'Хранение', h_tr:'Передача',
      tr_us:'США', tr_tiktok:'США, Сингапур', tr_none:'Без передачи',
      e_2y:'2 года', e_1y:'1 год', e_6m:'6 месяцев', e_3m:'3 месяца', e_24h:'24 часа', e_session:'Сессия',
      d_ga:'Идентифицирует посетителя для агрегированной статистики.',
      d_gid:'Различает посетителей в пределах суток.',
      d_clarity:'Тепловые карты и обезличенные записи сессий.',
      d_fbp:'Измерение эффективности рекламы и ремаркетинг.',
      d_gcl:'Атрибуция конверсий кампаниям Google Ads.',
      d_ide:'Показ релевантной рекламы на других сайтах.',
      d_ttp:'Измерение конверсий TikTok Ads.',
      d_yt:'Воспроизведение встроенных видео YouTube.',
      d_lang:'Запоминает язык и настройки отображения.',
      d_cc:'Хранит ваш выбор в отношении cookie-файлов.',
      d_sess:'Поддерживает сессию, корзину и авторизацию.'
    };
    return {
      consentModal: {
        title: 'Мы ценим вашу конфиденциальность',
        description: firstLayer(
          'Мы используем строго необходимые cookie-файлы для работы сайта. Аналитические, маркетинговые и функциональные cookie включаются <strong>только с вашего согласия</strong>. Вы можете принять все необязательные, принять только необходимые или настроить каждую категорию отдельно. Согласие можно отозвать в любой момент.',
          'Необходимые cookie — всегда, остальные — <strong>только с вашего согласия</strong>.',
          'Подробнее'),
        acceptAllBtn: 'Принять все необязательные',
        acceptNecessaryBtn: 'Принять только необходимые',
        showPreferencesBtn: 'Настроить',
        footer: links(t)
      },
      preferencesModal: {
        title: 'Настройки cookie-файлов',
        acceptAllBtn: 'Принять все необязательные',
        acceptNecessaryBtn: 'Принять только необходимые',
        savePreferencesBtn: 'Сохранить выбор',
        closeIconLabel: 'Закрыть',
        serviceCounterLabel: 'Сервис|Сервиса|Сервисов',

        /* акцент на согласии */
        '#cc-main .cm__btn[data-role="all"]{background:' + C.accent + ';border-color:' + C.accent + ';color:#fff}' +
        /* приглушённый отказ. Серый выбран AA-контрастный (5.5:1) —
           нечитаемая кнопка добавила бы к риску по данным ещё и нарушение доступности. */
        '#cc-main .cm__btn[data-role="necessary"],#cc-main .pm__btn[data-role="necessary"]' +
        '{background:#f1f3f5;border-color:#dee2e6;color:#5c636a;font-weight:500}' +
        '#cc-main .cm__btn[data-role="necessary"]:hover,#cc-main .pm__btn[data-role="necessary"]:hover' +
        '{background:#e9ecef;border-color:#ced4da;color:#495057}' +
        /* на мобильном ряд рассыпается в столбец: настройки / отказаться / принять.
           «Принять» оказывается внизу — ближе всего к большому пальцу. */
        '@media(max-width:640px){#cc-main .cm__btns{flex-direction:column;align-items:stretch}' +
        '#cc-main .cm__btn-group,#cc-main .cm__btn{width:100%}}' +
        /* v7/v8: полоса внизу — «Refuz» и «Accept toate» в один ряд, «Setări» ссылкой над ними.
           Баннер занимает ~25% экрана телефона вместо ~46% у плашки box wide.
           v8: селекторы усилены (.cm.cm--bar) и !important — cookieconsent.css грузится
           позже наших стилей и при равной специфичности перебивал их (кнопки оставались столбиком). */
        /* v9 прятал здесь подвал, потому что ссылка на политику дублировалась:
           она была вшита в румынский текст первого слоя. С v15 в тексте её нет,
           подвал — единственное место ссылки, и прятать его нельзя:
           без ссылки на политику требование закона не выполняется. */
        '@media(max-width:640px){#cc-main .cm.cm--bar .cm__btns{flex-direction:row!important;flex-wrap:wrap!important;gap:8px!important;padding-top:8px!important}' +
        '#cc-main .cm.cm--bar .cm__btn-group{display:contents!important}' +
        '#cc-main .cm.cm--bar .cm__btn{flex:1 1 0!important;width:auto!important;margin:0!important;min-height:44px}' +
        '#cc-main .cm.cm--bar .cm__btn[data-role="necessary"]{order:2}' +
        '#cc-main .cm.cm--bar .cm__btn[data-role="all"]{order:3;flex:1.6 1 0!important}' +
        '#cc-main .cm.cm--bar .cm__btn[data-role="show"]{order:1;flex:1 1 100%!important;min-height:0;padding:2px 0!important;background:none!important;' +
        'border:0!important;color:inherit!important;text-decoration:underline;font-weight:400;font-size:13px}' +
        '#cc-main .cm.cm--bar .cm__title{font-size:15px;margin-bottom:4px}' +
        '#cc-main .cm.cm--bar .cm__desc{font-size:13px}#cc-main .cm.cm--bar .cm__desc a{font-weight:400;text-decoration:underline}}'
      ) : '') +

      '#mdcc-fab{position:fixed;bottom:16px;' + (C.floatingSide === 'right' ? 'right' : 'left') + ':16px;' +
      'z-index:2147482000;display:inline-flex;align-items:center;gap:.45rem;padding:.5rem .75rem;' +
      'font:600 13px/1.2 inherit;color:#fff;background:' + C.accent + ';border:0;border-radius:999px;' +
      'cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:.9;transition:opacity .2s,transform .2s}' +
      '#mdcc-fab:hover{opacity:1;transform:translateY(-1px)}' +
      '#mdcc-fab:focus-visible{outline:2px solid #fff;outline-offset:2px}' +
      '@media(max-width:480px){#mdcc-fab span{display:none}#mdcc-fab{padding:.55rem}}' +
      '@media(prefers-reduced-motion:reduce){#mdcc-fab{transition:none}}';
    document.head.appendChild(css);
  }

  /* ==========================================================================
     8. ЗАГРУЗКА БИБЛИОТЕКИ И СТАРТ
     ========================================================================== */

  function boot() {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = C.cdnBase + 'cookieconsent.css';
    document.head.appendChild(link);

    injectStyles();

    var s = document.createElement('script');
    s.src = C.cdnBase + 'cookieconsent.umd.js';
    s.defer = true;
    s.onload = function () {
      if (!window.CookieConsent) return;

      /* onModalReady срабатывает только когда модалка создаётся, а вернувшемуся
         посетителю с сохранённым согласием её не показывают. Полагаться на него
         в вопросе плавающей кнопки нельзя — без постоянной точки отзыва согласия
         требование закона не выполняется. Поэтому дожимаем её и здесь;
         injectFloating() защищён от повторной вставки. */
      var ensureRevokeUi = function () { injectFloating(); watchDataCc(); watchDocumentLang(); };
      var started = window.CookieConsent.run(CC_CONFIG);
      if (started && typeof started.then === 'function') started.then(ensureRevokeUi);
      else ensureRevokeUi();

      /* Нормализуем код языка и держим подпись плавающей кнопки в актуальном языке.
         Нормализация обязательна: setLanguage('ru-RU') в самой библиотеке проходит
         проверку, но дальше ищет перевод по исходной строке — 'ru-RU' в словаре нет,
         и вызов молча ничего не делает. Региональные коды на сайтах обычное дело
         (<html lang="ru-RU">), поэтому срезаем регион до делегирования. */
      var _setLang = window.CookieConsent.setLanguage;
      window.CookieConsent.setLanguage = function (lang, force) {
        var norm = normLang(lang) || lang;
        var r = _setLang.call(window.CookieConsent, norm, force);
        updateFabLabel(norm);
        return r;
      };

      window.MDCC = {
        show:  function () { window.CookieConsent.showPreferences(); },
        reset: function () { window.CookieConsent.reset(true); location.reload(); },
        log:   function () { try { return JSON.parse(localStorage.getItem('mdcc_consent_log') || '[]'); } catch (e) { return []; } },
        accepted: function (cat) { return window.CookieConsent.acceptedCategory(cat); }
      };
    };
    document.head.appendChild(s);
  }

  if (document.body) boot();
  else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
